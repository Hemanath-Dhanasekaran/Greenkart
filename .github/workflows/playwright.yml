name: Playwright Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Run Playwright tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java (required by Allure CLI)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Install Allure CLI
        run: npm install -g allure-commandline

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # GitHub Actions sets CI=true, so playwright.config.js runs headless
      # with the CI worker/retry settings. The custom Allure reporter builds
      # the HTML report into allure-report/<runId> at the end of the run.
      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # The custom reporter writes a nested allure-report/<runId>/ folder (kept
      # for local run history). For CI, rebuild a standard standalone report so
      # index.html, app.js, data/, widgets/ and plugin/ sit at the artifact root.
      - name: Generate standalone Allure report
        if: ${{ !cancelled() }}
        run: |
          allure generate test-results/allure-results/* --clean -o allure-report
          for f in index.html app.js styles.css data widgets plugin; do
            test -e "allure-report/$f" || { echo "::error::allure-report/$f missing"; exit 1; }
          done
          ls -la allure-report

      - name: Upload Allure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Allure results (raw)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: test-results/allure-results/
          retention-days: 30
