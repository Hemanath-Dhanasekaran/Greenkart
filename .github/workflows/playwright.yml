name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Daily regression run at 09:00 IST (03:30 UTC), recorded by the QA
  # Intelligence history even when no code changed.
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

# Read-only: this workflow only checks out code and uploads artifacts.
permissions:
  contents: read

jobs:
  test:
    name: Run Playwright tests
    # Pinned instead of ubuntu-latest so runner image migrations can't change
    # the environment underneath the tests.
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Java (required by Allure CLI)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Installs the Allure CLI pinned in package.json (allure-commandline),
      # so CI generates the same report layout as local runs.
      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # GitHub Actions sets CI=true, so playwright.config.js runs headless
      # with the CI worker/retry settings. The custom Allure reporter builds
      # the HTML report into allure-report/<runId> at the end of the run.
      - name: Run Playwright tests
        id: tests
        run: npx playwright test

      # QA Intelligence: turn Playwright's JSON report into a small sanitised
      # results file (titles, outcomes, retries, short errors). Runs even when
      # earlier steps failed so the history can tell "tests failed" apart from
      # "tests never ran". Never fails the job.
      - name: Summarize test results for QA history
        if: ${{ always() }}
        continue-on-error: true
        env:
          QA_INTEL_SCHEDULE: ${{ github.event.schedule }}
          QA_INTEL_TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: node qa-intel/bin/qa-intel.js extract-results

      - name: Upload QA history results
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: qa-intel-results-attempt-${{ github.run_attempt }}
          path: qa-intel-output/run-results.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # The custom reporter writes a nested allure-report/<runId>/ folder (kept
      # for local run history). For CI, rebuild one standalone report at the
      # artifact root. --single-file embeds all data, widgets and plugins into
      # index.html, so the downloaded report opens by double-click (file://).
      - name: Generate standalone Allure report
        if: ${{ !cancelled() }}
        run: |
          npx allure --version
          npx allure generate test-results/allure-results/* --single-file --clean -o allure-report
          ls -la allure-report
          test -s allure-report/index.html || { echo "::error::allure-report/index.html missing"; exit 1; }
          grep -q "d('widgets/summary.json'" allure-report/index.html \
            || { echo "::error::allure-report/index.html has no embedded report data"; exit 1; }

      - name: Upload Allure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Allure results (raw)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: allure-results
          path: test-results/allure-results/
          retention-days: 30
